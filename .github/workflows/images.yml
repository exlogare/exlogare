name: Community Edition Images

on:
  push:
    branches: [main, dev, test]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/exlogare/exlogare-api
  IMAGE_WEB: ghcr.io/exlogare/exlogare-web

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      push: ${{ steps.tags.outputs.push }}
      version: ${{ steps.tags.outputs.version }}
      tags_api: ${{ steps.tags.outputs.tags_api }}
      tags_web: ${{ steps.tags.outputs.tags_web }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tags
        id: tags
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            SHA="${{ github.sha }}"
            SHA_SHORT="${SHA:0:7}"
            VERSION=$(grep '^version' pyproject.toml | head -1 | sed -E 's/^version\s*=\s*"([^"]+)".*/\1/')
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            {
              echo "tags_api<<EOF"
              echo "${{ env.IMAGE_API }}:pr-${SHA_SHORT}"
              echo "EOF"
              echo "tags_web<<EOF"
              echo "${{ env.IMAGE_WEB }}:pr-${SHA_SHORT}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION=$(grep '^version' pyproject.toml | head -1 | sed -E 's/^version\s*=\s*"([^"]+)".*/\1/')
          SUFFIX=""

          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            SUFFIX=""
          elif [[ "${{ github.ref }}" == refs/heads/dev || "${{ github.ref }}" == refs/heads/test ]]; then
            SUFFIX="-${GITHUB_REF_NAME}"
          else
            echo "unsupported ref: ${{ github.ref }}" >&2
            exit 1
          fi

          api_tags=()
          web_tags=()

          add_tags() {
            local name="$1"
            shift
            local -n out=$2
            for tag in "$@"; do
              out+=("${name}:${tag}")
            done
          }

          names=("${VERSION}${SUFFIX}" "latest${SUFFIX}")
          if [[ -z "$SUFFIX" ]]; then
            MAJOR="${VERSION%%.*}"
            REST="${VERSION#*.}"
            MINOR="${REST%%.*}"
            names+=("${MAJOR}.${MINOR}" "${MAJOR}")
          fi

          add_tags "${{ env.IMAGE_API }}" api_tags "${names[@]}"
          add_tags "${{ env.IMAGE_WEB }}" web_tags "${names[@]}"

          {
            echo "push=true"
            echo "version=${VERSION}"
            echo "tags_api<<EOF"
            printf '%s\n' "${api_tags[@]}"
            echo "EOF"
            echo "tags_web<<EOF"
            printf '%s\n' "${web_tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "API tags:"
          printf '  %s\n' "${api_tags[@]}"
          echo "Web tags:"
          printf '  %s\n' "${web_tags[@]}"

  build-api:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: needs.prepare.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build metadata
        id: meta
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: ${{ needs.prepare.outputs.push == 'true' }}
          tags: ${{ needs.prepare.outputs.tags_api }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: needs.prepare.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build metadata
        id: meta
        run: echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: ${{ needs.prepare.outputs.push == 'true' }}
          tags: ${{ needs.prepare.outputs.tags_web }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
