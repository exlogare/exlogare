[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exlogare-selfhost"
version = "1.0.0"
description = "Exlogare Community Edition — self-hosted CI/CD failure analyzer with OpenAI-compatible LLM"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Exlogare" }]
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.8.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.8",
    "celery>=5.4.0",
    "httpx[socks]>=0.27.2",
    "cryptography>=43.0.1",
    "bcrypt>=4.2.0",
    "openai>=1.40.0",
    "python-multipart>=0.0.9",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "gunicorn>=23.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "respx>=0.21.1",
    "aiosqlite>=0.20.0",
    "ruff>=0.6.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
